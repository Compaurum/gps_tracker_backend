name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: lambda/go.mod
          cache-dependency-path: lambda/go.sum
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: go vet ./...
        working-directory: lambda
      - run: npx cdk synth --quiet

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The IAM role only trusts jobs in this environment. Restrict it to the main branch in
    # repo Settings → Environments, and optionally add yourself as a required reviewer.
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC token for AWS
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: lambda/go.mod
          cache-dependency-path: lambda/go.sum
      - run: npm ci
      # Without this, an unset variable surfaces as a vague "Could not load credentials" after 12 retries.
      - name: Check deploy role is configured
        if: vars.AWS_DEPLOY_ROLE_ARN == ''
        run: |
          echo "::error::Variable AWS_DEPLOY_ROLE_ARN is not set. Add it under Settings → Secrets and variables → Actions → Variables (or as a variable of the 'production' environment), using the DeployRoleArn output of the GpsTrackerGithubOidc stack."
          exit 1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
      # Only the app stack: the OIDC stack is deployed by hand so CI can't change its own access.
      - run: npx cdk deploy GpsTracker --require-approval never
